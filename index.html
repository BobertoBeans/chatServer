<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
</head>
<style>
    body {
        background-color: black;
        color: white
    }

    .container input:focus {
        outline: none;
    }

    .container {
        display: grid;
        place-items: center;
        width: 98.08vw;
        height: 3vh;
        background-color: black;
        border: 3px solid white;
        border-top: 0px;
        padding-right: 3px;
    }

    .container input {
        border: 0px;
        background-color: black;
        color: white;
        justify-self: left;
        width: 91vw;
    }

    .divvy {
        display: flex;
        box-sizing: border-box;
        border: 3px solid white;
        font-size: small;
        height: 90.62vh;
        width: 98.56vw;
        text-align: left;
        vertical-align: bottom;
        overflow-y: auto;
        overflow-wrap: anywhere;
    }
    
    .divvy::-webkit-scrollbar {
        display: none;
    }

    .sub {
        position: absolute;
        justify-self: right;;
    }

    .divvy p {
        align-self: flex-end;
        margin-top: auto;
    }
</style>
<body>
    <div class="divvy">
        <p id="feed"></p>
    </div>
    <div class="container">
        <input type="text" id="input"> 
        <button type="submit" id="submit" class="sub">send</button>
    </div>
    <button id="logout" hidden="true">log out</button>
    <button id="login" hidden="true">log in</button>
    <script>
        const wss = new WebSocket(`ws://${window.location.host}`)
        const inp = document.getElementById("input");
        function getCookie(name) {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return parts.pop().split(';').shift();
        }
        let sendable = true
        let btn = document.getElementById("submit");
        let first = true
        if (!getCookie("user")) {
            document.getElementById("login").hidden = false
        } else {
            document.getElementById("logout").hidden = false
        }
        wss.addEventListener('message', (m) => {
            if (m.data === "??quit??") {
                document.getElementById("feed").innerText += `You've left!`
            }
            else if (first && m.data === "Enter name: ") {
                if (!getCookie("user")) {
                    document.getElementById("feed").innerText += `${m.data}`
                } else {
                    wss.send(getCookie("user"))
                }
            } else if (!first) {
                document.getElementById("feed").innerText += `\n${m.data}`
            }
            sendable = true
        })

        document.getElementById("login").onclick = function() {
            window.location.href("/login");
        }

        document.getElementById("logout").onclick = function() {
            document.cookie.split(";").forEach(function(c) { document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); });
            window.location.href("/")
        }

        inp.addEventListener('keypress',(event) => {
            if (event.key == "Enter") {
                btn.click()
            }
        })

        if (sendable) {
            btn.onclick = function() {
                if (first) {
                    first = false
                }
                wss.send(inp.value)
                inp.value = ""
                sendable = false
            };
        }
    </script>
</body>
</html>
